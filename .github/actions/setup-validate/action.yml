name: 🧰 Setup validate
description: Shared Node/npm setup for parallel validate jobs

inputs:
  playwright:
    description: Cache and install Playwright Chromium when true
    required: false
    default: 'false'
  worker-env:
    description: Copy packages/worker/.env.example to .env when true
    required: false
    default: 'false'
  migrate-local:
    description: Apply local D1 migrations when true
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: 🟢 Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: npm

    - name: 🎭 Cache Playwright Browsers
      if: inputs.playwright == 'true'
      id: playwright-cache
      uses: actions/cache@v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 🧊 Cache Nx
      uses: actions/cache@v5.0.3
      with:
        path: .nx/cache
        key:
          ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'package-lock.json')
          }}-${{ github.sha }}-${{ github.job }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ hashFiles('nx.json', 'package-lock.json') }}-

    - name: 🧊 Enable Nx remote cache
      if: env.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != ''
      shell: bash
      run: |
        set -euo pipefail
        server='https://nx-cache.kody.codes'
        if ! curl -fsS --max-time 5 "$server/health" >/dev/null; then
          echo "Nx remote cache skipped: $server/health is unreachable."
          echo "Validate will use local .nx + actions/cache until the worker is deployed."
          exit 0
        fi
        # Nx treats a configured-but-unauthorized cache as fatal. Probe a
        # missing hash so a rotated GitHub secret that has not been synced
        # to the worker falls back to local cache instead of failing validate.
        probe_status="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' \
          --header "Authorization: Bearer ${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN}" \
          "$server/v1/cache/0000000000000000" || true)"
        case "$probe_status" in
          200|404)
            echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=$server" >> "$GITHUB_ENV"
            echo "Nx remote cache enabled ($server)"
            ;;
          *)
            echo "Nx remote cache skipped: $server rejected cache auth (HTTP ${probe_status:-curl-error})."
            echo "Validate will use local .nx + actions/cache until the worker secret matches."
            ;;
        esac

    - name: 📥 Install Dependencies
      shell: bash
      run: npm ci

    - name: 📝 Prepare worker env
      if: inputs.worker-env == 'true'
      shell: bash
      run: cp packages/worker/.env.example packages/worker/.env

    - name: 🎭 Install Playwright Browsers
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        echo "playwright-cache-hit=${{ steps.playwright-cache.outputs.cache-hit }}"
        # Cache hit: ensure is a no-op (executable already on disk).
        # Cache miss: download Chromium only — no apt --with-deps.
        npm run test:e2e:ensure

    - name: 🗄️ Apply D1 Migrations
      if: inputs.migrate-local == 'true'
      shell: bash
      run: npm run migrate:local
