name: Decide PR check enqueue
description: >
  Enqueue Validate or Preview when GitHub will not run pull_request workflows
  because the PR has merge conflicts. Skips mergeable, draft, and fork PRs.

outputs:
  enqueue:
    description: true when the caller should run Validate or deploy Preview
    value: ${{ steps.decide.outputs.enqueue }}
  cleanup:
    description: true when the caller should clean up a conflicted closed PR
    value: ${{ steps.decide.outputs.cleanup }}
  reason:
    description: Why enqueue was or was not chosen
    value: ${{ steps.decide.outputs.reason }}
  pr_number:
    description: Open same-repo PR number
    value: ${{ steps.decide.outputs.pr_number }}
  base_sha:
    description: PR base SHA
    value: ${{ steps.decide.outputs.base_sha }}
  head_sha:
    description: PR head SHA
    value: ${{ steps.decide.outputs.head_sha }}

runs:
  using: composite
  steps:
    - name: Decide
      id: decide
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node tools/ci/pr-check-enqueue.ts
