name: 🔁 Enqueue Validate

# Display title carries the PR head so tooling can match a
# pull_request_target run, whose GitHub head SHA is the base branch.
run-name: >-
  enqueue validate ${{ github.event.pull_request.number && format('#{0} ',
  github.event.pull_request.number) || '' }}${{
  github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches-ignore:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
    branches:
      - main

# checks: write lets a pull_request_target run publish ✅ Validate on the
# PR head. GitHub records that event's own checks on the base SHA.
permissions:
  contents: read
  pull-requests: read
  checks: write

# PR number, not branch name, so two fork PRs that share a head branch do
# not cancel each other. Push uses the full ref, which stays inside this repo.
concurrency:
  group: enqueue-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: 🔁 Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Checkout stays on github.sha. For pull_request_target that is the base
    # branch, never the PR head, so this job cannot run fork code. The called
    # Validate workflow checks out the head only after the fork guard.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.draft == false)
    outputs:
      enqueue: ${{ steps.decide.outputs.enqueue }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      base_sha: ${{ steps.decide.outputs.base_sha }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Decide
        id: decide
        uses: ./.github/actions/decide-pr-check-enqueue

  validate:
    needs: decide
    if: needs.decide.outputs.enqueue == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      pr_number: ${{ needs.decide.outputs.pr_number }}
      base_sha: ${{ needs.decide.outputs.base_sha }}
    secrets: inherit

  # pull_request_target check suites are attached to the base SHA. Publish
  # the same conclusion on the PR head so the head's required check exists.
  # Push runs already attach to the head, so this job stays skipped there.
  publish:
    needs:
      - decide
      - validate
    if: >-
      always() && github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.fork == false &&
      needs.decide.outputs.enqueue == 'true' && needs.validate.result !=
      'cancelled' && needs.validate.result != 'skipped'
    permissions:
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish head check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const result = process.env.VALIDATE_RESULT;
            if (!sha) {
              core.setFailed("Missing pull request head SHA.");
              return;
            }
            const conclusion = result === "success" ? "success" : "failure";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "✅ Validate",
              head_sha: sha,
              status: "completed",
              conclusion,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
