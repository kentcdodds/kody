name: 🧹 Purge ownerless MCP sessions

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Deployed Worker origin that serves /__maintenance/*
        type: choice
        options:
          - https://heykody.dev
        default: https://heykody.dev

permissions:
  contents: read

concurrency:
  group: purge-ownerless-mcp-sessions-${{ inputs.origin }}
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    name: 🧹 Purge ownerless MCP sessions
    timeout-minutes: 30
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🧹 Purge ownerless MCP sessions
        env:
          CAPABILITY_REINDEX_SECRET: ${{ secrets.CAPABILITY_REINDEX_SECRET }}
          PURGE_ORIGIN: ${{ inputs.origin }}
        run: |
          set -euo pipefail
          if [ -z "${CAPABILITY_REINDEX_SECRET:-}" ]; then
            echo "CAPABILITY_REINDEX_SECRET is required." >&2
            exit 1
          fi
          node tools/ci/purge-ownerless-mcp-sessions-cli.ts \
            --origin "${PURGE_ORIGIN}" \
            --ids tools/ci/ownerless-mcp-session-do-ids.json
