name: 🔁 Teams P8 Conversion Checks

# Backup and verify for the Teams P8 sharing and platform conversion
# (migration 0091, docs/contributing/preview-migration-rehearsal.md). Both
# steps are read-only. Production runs are Kent's (or ones he approves); a
# kody-branch-* target exercises the same steps on a rehearsal preview.
# Artifacts and logs on this public repo are world-readable, so every report
# leaves only sealed to `recipient_public_key` and the logs carry check names,
# never counts or rows.
#
# Run `backup` BEFORE the P8 migration deploys. Run `verify` AFTER it.

on:
  workflow_dispatch:
    inputs:
      target:
        description:
          production, or a branch preview worker name (kody-branch-<slug>)
        required: true
        type: string
        default: production
      recipient_public_key:
        description:
          base64 SPKI public key from `node tools/preview-rehearsal/seal.ts
          keygen`
        required: true
        type: string
      mode:
        description:
          backup (before the migration), verify (after it), or
          backup-then-verify (a rehearsal preview that already has the
          migration)
        required: true
        type: choice
        default: backup
        options:
          - backup
          - verify
          - backup-then-verify
      confirm:
        description: production — type "teams p8 conversion checks"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: teams-p8-conversion-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  conversion:
    name: 🔁 ${{ inputs.mode }} on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      OUT_DIR: conversion-out
    steps:
      - name: 🛂 Check who may run production
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The CI token reaches production for every target, so only main's
          # reviewed script runs with it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Run from main only, got $REF." >&2
            exit 1
          fi
          if [ "$TARGET" = "production" ]; then
            if [ "$ACTOR" != "kentcdodds" ]; then
              echo "Production conversion checks run as kentcdodds only (or Kent adds an approved runner here); got $ACTOR." >&2
              exit 1
            fi
            if [ "$CONFIRM" != "teams p8 conversion checks" ]; then
              echo 'Production needs confirm = "teams p8 conversion checks".' >&2
              exit 1
            fi
          elif ! [[ "$TARGET" =~ ^kody-branch-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "target must be production or a branch preview (kody-branch-<slug>), got '$TARGET'." >&2
            exit 1
          fi

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 💾 Seal the pre-conversion backup
        if: inputs.mode == 'backup' || inputs.mode == 'backup-then-verify'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node tools/teams-migration/convert-sharing-and-platform.ts --mode backup --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/backup.sealed.json"

      - name: ✅ Verify the conversion (sealed report)
        if: inputs.mode == 'verify' || inputs.mode == 'backup-then-verify'
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node tools/teams-migration/convert-sharing-and-platform.ts --mode verify --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/verify.sealed.json"

      - name: 🧾 Summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## 🔁 Teams P8 conversion (\`$MODE\`) on \`$TARGET\`"
            echo ""
            if compgen -G "$OUT_DIR/*.sealed.json" > /dev/null; then
              echo "Artifact \`teams-p8-conversion\` (run $RUN_ID) holds the sealed file(s). Counts and rows stay out of this public summary."
              echo ""
              echo "Open one with \`node tools/preview-rehearsal/seal.ts open --private-key <key> --in <file>.sealed.json --out <file>.json\`."
            else
              echo "No sealed file was written; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-p8-conversion
          path: conversion-out
          if-no-files-found: ignore
          retention-days: 30
