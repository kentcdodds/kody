name: 🛟 Teams P9 Pre-Migration D1 Bookmarks

# Seals read-only D1 Time Travel bookmarks (APP_DB, AUDIT_DB, JOBS_DB) before
# the Teams P9 contract deploy. Does not write to D1. Production runs are
# kentcdodds or cursor. Artifacts are sealed to recipient_public_key.

on:
  workflow_dispatch:
    inputs:
      target:
        description:
          production, or a branch preview worker name (kody-branch-<slug>)
        required: true
        type: string
        default: production
      recipient_public_key:
        description:
          base64 SPKI public key from `node tools/preview-rehearsal/seal.ts
          keygen`
        required: true
        type: string
      confirm:
        description: production — type "teams p9 pre-migration bookmarks"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: teams-p9-pre-migration-backup-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  bookmarks:
    name: 🛟 Bookmarks on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      OUT_DIR: bookmarks-out
    steps:
      - name: 🛂 Check who may run production
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            case "$ACTOR" in
              kentcdodds|cursor) ;;
              *)
                echo "Production bookmark capture runs as kentcdodds or cursor only; got $ACTOR." >&2
                exit 1
                ;;
            esac
            if [ "$CONFIRM" != "teams p9 pre-migration bookmarks" ]; then
              echo 'Production needs confirm = "teams p9 pre-migration bookmarks".' >&2
              exit 1
            fi
          elif ! [[ "$TARGET" =~ ^kody-branch-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "target must be production or a branch preview (kody-branch-<slug>), got '$TARGET'." >&2
            exit 1
          fi

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🛟 Capture sealed D1 bookmarks
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node tools/teams-migration/production-d1-bookmarks.ts \
            --target "$TARGET" \
            --recipient-public-key "$RECIPIENT_PUBLIC_KEY" \
            --out "$OUT_DIR/d1-bookmarks.sealed.json"

      - name: 🧾 Summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## 🛟 Teams P9 pre-migration D1 bookmarks on \`$TARGET\`"
            echo ""
            if [ -f "$OUT_DIR/d1-bookmarks.sealed.json" ]; then
              echo "Artifact \`teams-p9-pre-migration-bookmarks\` (run $RUN_ID) holds the sealed bookmarks. Bookmark strings stay out of this public summary."
              echo ""
              echo "Open with \`node tools/preview-rehearsal/seal.ts open --private-key <key> --in d1-bookmarks.sealed.json --out bookmarks.json\`."
            else
              echo "No sealed bookmarks were written; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-p9-pre-migration-bookmarks
          path: bookmarks-out
          if-no-files-found: ignore
          retention-days: 30
