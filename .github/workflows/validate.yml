name: ✅ Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    validate-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

# Same checks as `npm run validate`, split across runners so CPU-heavy suites
# (node/workers unit, Playwright E2E, MCP E2E, typecheck) do not contend on one
# machine. Local `npm run validate` remains the authoritative single-command
# gate.
jobs:
  static:
    runs-on: ubuntu-latest
    name: 🧹 Static
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Migration immutability validation compares against the PR merge
          # base and must never silently fall back to an editable ledger.
          fetch-depth: 0
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate

      # Keep running sibling static checks after a failure (same as local
      # `npm run validate` / concurrently), unless the job was cancelled.
      - name: ✨ Format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: 🔍 Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: 🧠 Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: 🏗️ Backup build
        if: ${{ !cancelled() }}
        run: npm run backup:build

      - name: 🗺️ Primitives
        if: ${{ !cancelled() }}
        run: npm run primitives:check

      - name: 🗄️ Migrations
        if: ${{ !cancelled() }}
        run: npm run migrations:check
        env:
          # PRs trust the fetched base SHA; main pushes trust the pre-push SHA.
          # The validator rejects this value if it resolves to HEAD.
          MIGRATION_VALIDATION_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before || ''
            }}

      - name: 🛡️ Deploy guardrails
        if: ${{ !cancelled() }}
        run: npm run deploy-guardrails:check

  node:
    runs-on: ubuntu-latest
    name: 🧪 Node
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Node coverage includes migration immutability helpers that need a
          # trusted pre-change Git base (same as migrations:check).
          fetch-depth: 0
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          worker-env: 'true'

      - name: 🧪 Node unit tests
        run: npm run test:node
        env:
          MIGRATION_VALIDATION_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before || ''
            }}

  workers:
    runs-on: ubuntu-latest
    name: ☁️ Workers
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          worker-env: 'true'
          migrate-local: 'true'

      - name: ☁️ Workers unit tests
        run: npm run test:workers

  mcp:
    runs-on: ubuntu-latest
    name: 🔌 MCP
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          worker-env: 'true'

      - name: 🔌 MCP E2E
        run: npm run test:mcp

  e2e:
    runs-on: ubuntu-latest
    name: 🎭 E2E
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          playwright: 'true'
          worker-env: 'true'

      - name: 🎭 Playwright E2E
        run: npm run test:e2e:run

  validate:
    runs-on: ubuntu-latest
    name: ✅ Validate
    timeout-minutes: 2
    needs:
      - static
      - node
      - workers
      - mcp
      - e2e
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
    steps:
      - name: ✅ All checks passed
        if: >-
          needs.static.result == 'success' && needs.node.result == 'success' &&
          needs.workers.result == 'success' && needs.mcp.result == 'success' &&
          needs.e2e.result == 'success'
        run: echo "All validate jobs passed"

      - name: ❌ Report failures
        if: >-
          needs.static.result != 'success' || needs.node.result != 'success' ||
          needs.workers.result != 'success' || needs.mcp.result != 'success' ||
          needs.e2e.result != 'success'
        run: |
          echo "static=${{ needs.static.result }}"
          echo "node=${{ needs.node.result }}"
          echo "workers=${{ needs.workers.result }}"
          echo "mcp=${{ needs.mcp.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          exit 1
