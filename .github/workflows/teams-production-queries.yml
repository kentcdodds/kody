name: 🔎 Teams Production Queries

# Read-only production queries that stay useful after the Teams P8 conversion
# (docs/contributing/teams-production-queries.md): OAuth grant counts, Stripe
# subscription counts, and the credential-exposure report. Production runs are
# Kent's (or ones he approves); a kody-branch-* target exercises the same
# queries on a rehearsal preview. Artifacts and logs on this public repo are
# world-readable, so every report leaves only sealed to `recipient_public_key`.

on:
  workflow_dispatch:
    inputs:
      target:
        description:
          production, or a branch preview worker name (kody-branch-<slug>)
        required: true
        type: string
        default: production
      recipient_public_key:
        description:
          base64 SPKI public key from `node tools/preview-rehearsal/seal.ts
          keygen`
        required: true
        type: string
      confirm:
        description: production — type "read-only production queries"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: teams-production-queries-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  queries:
    name: 🔎 Queries on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      OUT_DIR: queries-out
    steps:
      - name: 🛂 Check who may run production
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The CI token reaches production for every target, so only main's
          # reviewed script runs with it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Run from main only, got $REF." >&2
            exit 1
          fi
          if [ "$TARGET" = "production" ]; then
            # Approved production runners (Kent + Cloud Agent gh user for
            # credential-exposure follow-through without waiting on Kent).
            case "$ACTOR" in
              kentcdodds|cursor) ;;
              *)
                echo "Production queries run as an approved actor only (kentcdodds or cursor); got $ACTOR." >&2
                exit 1
                ;;
            esac
            if [ "$CONFIRM" != "read-only production queries" ]; then
              echo 'Production needs confirm = "read-only production queries".' >&2
              exit 1
            fi
          elif ! [[ "$TARGET" =~ ^kody-branch-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "target must be production or a branch preview (kody-branch-<slug>), got '$TARGET'." >&2
            exit 1
          fi

      - name: 🔑 Note missing Stripe secret (P8 Stripe count only)
        if: inputs.target == 'production'
        env:
          # Direct assignment on this production-only step. A job-level
          # `condition && secrets.X || ''` can evaluate empty for environment
          # secrets, and a job-level assignment would expose the key on
          # preview targets.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key="${STRIPE_SECRET_KEY-}"
          trimmed="${key#"${key%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          if [ -z "$trimmed" ]; then
            echo "::warning title=Missing Actions secret::STRIPE_SECRET_KEY is empty on this environment, so the P8 Stripe subscription count is skipped. Credential-exposure and other D1/KV queries still run. Add the secret under Settings > Secrets and variables > Actions (and the production environment), then re-run for a full P8 report." >&2
            echo "STRIPE_SECRET_MISSING=1" >> "$GITHUB_ENV"
          fi

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔎 Run the read-only queries (sealed)
        if: inputs.target != 'production'
        run: |
          # Collect both exit statuses: the OAuth/Stripe report must not block the
          # independent D1 credential-exposure report. Fail the step if either fails.
          set -uo pipefail
          mkdir -p "$OUT_DIR"
          status=0
          # OAuth and Stripe report (Stripe skipped on previews).
          node tools/teams-migration/production-queries.ts --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/report.sealed.json" || status=$?
          # Credential-exposure needs only Cloudflare D1; never blocked on Stripe.
          node tools/teams-migration/credential-exposure-queries.ts --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/credential-exposure.sealed.json" || status=$?
          exit "$status"

      - name: 🔎 Run the read-only queries (sealed)
        if: inputs.target == 'production'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Collect both exit statuses: the OAuth/Stripe report must not block the
          # independent D1 credential-exposure report. Fail the step if either fails.
          set -uo pipefail
          mkdir -p "$OUT_DIR"
          status=0
          # OAuth and Stripe report (Stripe skipped when STRIPE_SECRET_KEY is empty).
          node tools/teams-migration/production-queries.ts --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/report.sealed.json" || status=$?
          # Credential-exposure needs only Cloudflare D1; never blocked on Stripe.
          node tools/teams-migration/credential-exposure-queries.ts --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/credential-exposure.sealed.json" || status=$?
          exit "$status"

      - name: 🧾 Summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## 🔎 Teams production queries on \`$TARGET\`"
            echo ""
            if [ -f "$OUT_DIR/report.sealed.json" ] || [ -f "$OUT_DIR/credential-exposure.sealed.json" ]; then
              echo "Artifact \`teams-production-queries\` (run $RUN_ID) holds the sealed reports (OAuth/Stripe + credential-exposure). Counts stay out of this public summary."
              echo ""
              echo "Open with \`node tools/preview-rehearsal/seal.ts open --private-key <key> --in report.sealed.json --out report.json\` (and the same for \`credential-exposure.sealed.json\`)."
              if [ "${STRIPE_SECRET_MISSING:-}" = "1" ]; then
                echo ""
                echo "Stripe subscription counts were skipped because \`STRIPE_SECRET_KEY\` is unset."
              fi
            else
              echo "No report was written; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-production-queries
          path: queries-out
          if-no-files-found: ignore
          retention-days: 30
