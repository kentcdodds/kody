name: 🔎 Teams Production Queries

# The read-only production queries Teams needs before the P8 data conversion
# (docs/contributing/teams-production-queries.md). Production runs are Kent's
# (or ones he approves); a kody-branch-* target exercises the same D1 and KV
# queries on a rehearsal preview. Artifacts and logs on this public repo are
# world-readable, so the report leaves only sealed to `recipient_public_key`.

on:
  workflow_dispatch:
    inputs:
      target:
        description:
          production, or a branch preview worker name (kody-branch-<slug>)
        required: true
        type: string
        default: production
      recipient_public_key:
        description:
          base64 SPKI public key from `node tools/preview-rehearsal/seal.ts
          keygen`
        required: true
        type: string
      confirm:
        description: production — type "read-only production queries"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: teams-production-queries-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  queries:
    name: 🔎 Queries on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY:
        ${{ inputs.target == 'production' && secrets.STRIPE_SECRET_KEY || '' }}
      TARGET: ${{ inputs.target }}
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      OUT_DIR: queries-out
    steps:
      - name: 🛂 Check who may run production
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The CI token reaches production for every target, so only main's
          # reviewed script runs with it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Run from main only, got $REF." >&2
            exit 1
          fi
          if [ "$TARGET" = "production" ]; then
            # Approved production runners (Kent + Cloud Agent gh user for
            # credential-exposure follow-through without waiting on Kent).
            case "$ACTOR" in
              kentcdodds|cursor) ;;
              *)
                echo "Production queries run as an approved actor only (kentcdodds or cursor); got $ACTOR." >&2
                exit 1
                ;;
            esac
            if [ "$CONFIRM" != "read-only production queries" ]; then
              echo 'Production needs confirm = "read-only production queries".' >&2
              exit 1
            fi
          elif ! [[ "$TARGET" =~ ^kody-branch-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "target must be production or a branch preview (kody-branch-<slug>), got '$TARGET'." >&2
            exit 1
          fi

      - name: 🔑 Require the Stripe secret for production
        if: inputs.target == 'production'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error title=Missing Actions secret::The repository Actions secret STRIPE_SECRET_KEY is not set (or is empty), so the Stripe subscription count cannot run against production. Add it under Settings > Secrets and variables > Actions, then re-run." >&2
            exit 1
          fi

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔎 Run the read-only queries (sealed)
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node tools/teams-migration/production-queries.ts --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/report.sealed.json"
          node tools/teams-migration/credential-exposure-queries.ts --target "$TARGET" --recipient-public-key "$RECIPIENT_PUBLIC_KEY" --out "$OUT_DIR/credential-exposure.sealed.json"

      - name: 🧾 Summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## 🔎 Teams production queries on \`$TARGET\`"
            echo ""
            if [ -f "$OUT_DIR/report.sealed.json" ] || [ -f "$OUT_DIR/credential-exposure.sealed.json" ]; then
              echo "Artifact \`teams-production-queries\` (run $RUN_ID) holds the sealed reports (P8 conversion + credential-exposure). Counts stay out of this public summary."
              echo ""
              echo "Open with \`node tools/preview-rehearsal/seal.ts open --private-key <key> --in report.sealed.json --out report.json\` (and the same for \`credential-exposure.sealed.json\`)."
            else
              echo "No report was written; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-production-queries
          path: queries-out
          if-no-files-found: ignore
          retention-days: 30
