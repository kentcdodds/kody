name: 🔁 Enqueue Preview

run-name: >-
  enqueue preview ${{ github.event.pull_request.number && format('#{0} ',
  github.event.pull_request.number) || '' }}${{
  github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches-ignore:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed
    branches:
      - main

# deployments: write is required because a conflicted close calls preview
# cleanup. GitHub rejects the caller at startup unless it allows every
# permission a nested preview.yml job requests.
# checks: write publishes 🔎 Deploy Preview Resources on the PR head.
# A called job is prefixed, and pull_request_target records its suite on
# the base SHA. Push uses the decided head SHA.
permissions:
  contents: read
  pull-requests: write
  deployments: write
  checks: write

# PR number, not branch name, so two fork PRs that share a head branch do
# not cancel each other. Push uses the full ref, which stays inside this repo.
concurrency:
  group: enqueue-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: 🔁 Decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Same checkout rule as Enqueue Validate: base SHA only, no PR head.
    # Closed same-repo PRs still decide, including drafts, so a preview
    # deployed before the draft flip can be deleted. Forks never run.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.fork == false &&
        (github.event.action == 'closed' ||
          github.event.pull_request.draft == false))
    outputs:
      enqueue: ${{ steps.decide.outputs.enqueue }}
      cleanup: ${{ steps.decide.outputs.cleanup }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Decide
        id: decide
        uses: ./.github/actions/decide-pr-check-enqueue

  preview:
    needs: decide
    if: >-
      needs.decide.outputs.enqueue == 'true' || needs.decide.outputs.cleanup ==
      'true'
    uses: ./.github/workflows/preview.yml
    with:
      pr_number: ${{ needs.decide.outputs.pr_number }}
      action:
        ${{ needs.decide.outputs.cleanup == 'true' && 'cleanup' || 'deploy' }}
    secrets: inherit

  publish:
    needs:
      - decide
      - preview
    if: >-
      always() && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.fork == false) &&
      needs.decide.outputs.enqueue == 'true' && needs.preview.result !=
      'cancelled' && needs.preview.result != 'skipped'
    permissions:
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish head check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          HEAD_SHA:
            ${{ github.event.pull_request.head.sha ||
            needs.decide.outputs.head_sha }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const result = process.env.PREVIEW_RESULT;
            if (!sha) {
              core.setFailed("Missing pull request head SHA.");
              return;
            }
            const conclusion = result === "success" ? "success" : "failure";
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "🔎 Deploy Preview Resources",
              head_sha: sha,
              status: "completed",
              conclusion,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
