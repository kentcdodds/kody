name: Friction
description: Log a contributor or agent papercut while working in this repo
title: 'Friction: '
labels: [friction]
body:
  - type: markdown
    attributes:
      value: >
        Search open `friction` issues before filing. One papercut per issue.
        This is not Kody product feedback — use platform friction for that. Omit
        secrets, tokens, and unrelated private content. Include a short
        preliminary investigation (what you already looked at). List relevant
        files only when you know some. Do not invent a root cause.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you were doing and what got in the way.
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What you wanted
      description: The expected path.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, files, or conditions a later agent can follow.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost
      description:
        Time lost, how often this happens, who it hits, and the workaround.
    validations:
      required: true
  - type: textarea
    id: preliminary
    attributes:
      label: Preliminary investigation
      description: >
        What you already looked at. Keep it short. Do not invent a root cause.
        Do not paste a full issue thread.
    validations:
      required: true
  - type: textarea
    id: relevant-files
    attributes:
      label: Relevant files
      description: >
        Paths that look relevant, one per line. Leave blank when none are known.
    validations:
      required: false
