# Kody system primitives map (taxonomy)
#
# Stable vocabulary for the visual-recap skill
# (.agents/skills/visual-recap/SKILL.md). This is NOT a living feature
# changelog and NOT derived source-of-truth for behavior — architecture
# docs under `docs:` are. Code is the truth for implementation.
#
# Risk labels used in PR recaps:
#   composes - wires existing primitives without changing them
#   extends  - changes a primitive's behavior, shape, or contract
#   adds     - introduces a new primitive (update this file in the same PR)
#
# Update this file only when adding, removing, or materially reshaping a
# primitive (id, name, group, code roots, or meaning). Do NOT edit `summary`
# for ordinary feature work — put that in the linked architecture docs.
#
# `code` entries are coarse ownership roots for
# `classify-primitives.mjs` (longest-prefix match). Prefer directories over
# file lists. Keep the map small.

version: 1

groups:
  - id: surfaces
    name: Entry points
  - id: auth
    name: Identity & auth
  - id: assistant
    name: User-facing assistant primitives
  - id: runtime
    name: Execution runtimes
  - id: storage
    name: Storage & infrastructure

