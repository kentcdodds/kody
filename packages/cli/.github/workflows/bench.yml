name: bench

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*

      - name: Cache workerd
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kody/workerd
          key:
            workerd-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/workerd-binary.ts') }}

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Benchmark
        run:
          node scripts/bench.mjs --runs 20 --json bench.json --budget
          scripts/bench-budgets.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-${{ github.sha }}
          path: bench.json
